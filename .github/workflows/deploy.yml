name: Deploy to GitHub Pages

on:
  push:
    branches: 'main' # Скрипт срабатывает при пуше в ветку main

# Разрешения для работы с GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Убрали лишние node-version и cache отсюда

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 # Здесь это настроено правильно!
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload production-ready files
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Убрали лишний node-version отсюда

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 # Убрали лишние node-version и cache отсюда
