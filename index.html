<!doctype html>
<html lang="ru">
  <head>
    <title>Yandex Scale Crossword</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="css/styles.css" media="screen" />
  </head>
  <body>
    <div id="main">
      <div class="app-header">
        <h1>Yandex Scale Crossword</h1>
        <p class="subtitle">По материалам трека DeepTech</p>
      </div>

      <div class="crossword-container">
        <div class="grid-wrapper">
          <div id="crossword-grid" class="crossword-grid"></div>
        </div>

        <aside class="clues-panel">
          <div class="clues-section">
            <h2>По горизонтали</h2>
            <ul id="clues-across"></ul>
          </div>
          <div class="clues-section">
            <h2>По вертикали</h2>
            <ul id="clues-down"></ul>
          </div>
          <button id="check-btn" class="check-btn">Проверить</button>
          <div id="result-message" class="result-message"></div>
        </aside>
      </div>
    </div>

    <div id="view-2-screen" class="fullscreen-overlay">
      <div class="view-2-content"></div>
      <div id="view-2-close">
        <svg class="close-btn" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <g><path class="close-icon"></path></g>
        </svg>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/index.js"></script>
  </body>
</html>
